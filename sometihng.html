<!DOCTYPE html>
<html>
<head>
<title>My animal fact file</title>
<style>
/*Page background-sets the colourand fontfor the whole page*/
body{
background-color: darkgreen;
font-family: Arial,sans-serif;
}
/*Box model-width sets the content,padding pushes the text away from the edges,border draws a visible frame around the fact file , margin pushes the fact file away from the screen edge*/
.fact-file{
background-color:lightyellow;
color:darkslategray;
width:260px;
padding:25px;
border:4px solid forestgreen;
margin: 4px;
}
/*Animal name-so it stands out*/
.animal-name{
color:forestgreen;
font-size:25px;
}

/*Detail rows-dark text on the light bakground*/
.detail{
 color:darkslategray;   
}
/*orange and italic to make it feel special*/
.cooolfact{
color:darkorange;
font-style: italic;
}
</style>
</head>
<body>

<div class="fact-file">
<h2 class="animal-name">Snow Leopard</h2>
<p class="detail">Type:Big Cat</p>
<p class="detail">Lives in:Mountain ranges of Central Asia</p>
<p class="detail">Diet:Deer,Goats and wild sheep</p>
<p class="cooolfact">Cool fact : Can leap upto 15 metres in one jump!</p>
</div>

</body>
</html>
