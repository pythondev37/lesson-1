<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to JavaScript</title>
</head>
<body id="something">
    <h1>JavaScript is a dynamic programming language used in web design.</h1>
    <p id="result"></p>
    <script>
        document.getElementById("something").style.backgroundColor = "tomato" ; 
        let name = "Amrit" ;
        document.write("Hi.My name is " + name) ;
        document.write("<h2>JavaScript magic tricks</h2>")
        let Englishmarks = 23 ;
        let mathsmarks = 24 ; 
        let sciencemarks  = 25 ; 
        let total = sciencemarks  + mathsmarks + Englishmarks ; 
        document.getElementById("result").innerHTML= total ;

    </script>
</body>
</html>
