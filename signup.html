<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body style="color:blue;background-color:black">
    <h1>Registration for an Amino account.</h1>
    <form>
        <div>
        <p>Please enter your name:</p>
<input required type="text" name="name" id="name" placeholder="Spongebob Squarepants">
</div>
<br>
<div>
<p>Please enter your email</p>
<input required type="email" name="email" id="email" placeholder="Spants@gmail.com">
</div>
<br>
<div>
<p>Please enter your the username that you will be using for this for this website:</p>
<input  required type="text" name="username" id="username" placeholder="Spants123">
</div>
<br>
<div>
    <p>Please enter your password:</p>
    <input required type="password" name="password" id="password">
</div>
<br>
<div>
<p>Please confirm your password:</p>
<input required type="password" name="confirm password" id="confirm password">
</div>
<br>
<div>
    <button type="submit">Submit</button>
    </div>
    <br>
    <div>
    <button type="reset">Reset</button>
</div>
<br> 
</form>
<div>
    <p>Already have an account? Click <a href="login.html">here</a></p>
</div>
</body>
</html>
